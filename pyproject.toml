# Workspace root. It is not a package itself: `uv sync` here installs every
# member, including the `ssebench` CLI, into one environment.

[tool.uv.workspace]
members = [
  "bench",
  "runtime/evaluator",
  "runtime/mcp",
  # Python plugins only, so that a plugin with nothing but a run.sh is no member.
  "runtime/plugins/artifact",
  "runtime/plugins/oracle",
  "sdk/python",
  "agents/*/*-sse",
]

[dependency-groups]
dev = [
  "basedpyright>=1.29.0",
  "hatchling>=1.27.0",
  "jsonschema>=4.26.0",
  "pytest>=8.3.5",
  "ruff>=0.16.10",
  # The optional Kubernetes backend, so that its tests and type checks run.
  "kubernetes>=31",
]

# Marks the SSEBench home: the CLI looks for this table to find agents/,
# images/, runtime/, models/, deploy/ and datasets/ (see ssebench.paths).
[tool.ssebench]

[tool.ruff]
target-version = "py312"
line-length = 120
# Directories whose top-level modules count as first-party for import sorting.
src = ["bench/src", "runtime/evaluator", "runtime/mcp", "runtime/plugins/*", "agents/*/*-sse", "tools/docs"]
# Task sources are upstream code; docs snippets are formatted for reading.
extend-exclude = ["datasets", "docs"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "B",  # flake8-bugbear
  "I",  # isort
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["bench", "runtime/evaluator", "runtime/mcp", "runtime/plugins", "sdk/python", "agents", "tools/docs", "tools/report"]
# setuptools editable installs use an import hook that pyright cannot follow.
extraPaths = ["sdk/python"]

[tool.pytest.ini_options]
testpaths = ["bench/tests", "sdk/python/tests", "runtime/evaluator/tests", "runtime/mcp/tests", "runtime/plugins/artifact/tests", "runtime/plugins/oracle/tests", "tools/docs", "tools/report"]
# The reference docs generators (tools/docs/refdocs) and tools/report/collect.py are not packages; their tests import them from here.
pythonpath = ["tools/docs", "tools/report", "runtime/plugins/oracle"]
addopts = ["--import-mode=importlib"]
markers = [
  "integrity: benchmark-integrity bypass tests; need Docker and the images of a sandbox or sidecar run",
  "agents: run each bundled agent with no internet against a stub model; need Docker and the base image",
]
