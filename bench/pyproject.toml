[project]
name = "ssebench"
version = "1.1.0"
description = "Benchmark AI coding agents on real security vulnerabilities"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SSEBench Team" }]
keywords = ["benchmark", "security", "vulnerability", "agents", "llm", "patch", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "pydantic>=2.11.9",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[project.urls]
Homepage = "https://github.com/42-b3yond-6ug/ssebench"
Documentation = "https://github.com/42-b3yond-6ug/ssebench/tree/main/docs"
Repository = "https://github.com/42-b3yond-6ug/ssebench"
Issues = "https://github.com/42-b3yond-6ug/ssebench/issues"

[project.scripts]
ssebench = "ssebench.cli:main"

[project.optional-dependencies]
kubernetes = [
    "kubernetes>=31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssebench"]

# The hook copies the repository's assets into the wheel and the sdist; see hatch_build.py.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/hatch_build.py", "/README.md", "/LICENSE", "/NOTICE"]
