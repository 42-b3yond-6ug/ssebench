[project]
name = "ssebench"
version = "1.0.0.dev0"
description = "SSEBench - Software Security Benchmark for AI Agents"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.11.9",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[project.scripts]
ssebench = "ssebench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssebench"]
