[project]
name = "ssebench"
version = "0.1.0"
description = "SSEBench - Software Security Benchmark for AI Agents"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.11.9",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[project.scripts]
ssebench = "cli:main"

[dependency-groups]
dev = ["ruff>=0.11.0", "basedpyright>=1.29.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "agents", "middleware", "models", "pipe", "runner", "tasks"]
