[project]
name = "opencode_sse"
version = "0.1.0"
description = "OpenCode agent for SSEBench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ssebench-sdk",
  "httpx>=0.27",
  "httpx-sse>=0.4",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.uv.sources]
ssebench-sdk = { path = "../../../sdk/python", editable = false }
