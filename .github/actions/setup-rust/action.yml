name: Set up Rust
description: Install the toolchain pinned in rust-toolchain.toml and restore the Cargo cache.
runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      run: |
        rustup toolchain install
        rustc --version
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
