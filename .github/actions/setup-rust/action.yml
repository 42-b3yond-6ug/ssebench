name: Set up Rust
description: Install the toolchain pinned in rust-toolchain.toml and restore the Cargo cache.
runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      run: |
        rustup toolchain install
        rustc --version
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
