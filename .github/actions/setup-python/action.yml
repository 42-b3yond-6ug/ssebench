name: Set up Python
description: Install uv with a dependency cache and sync the uv workspace from uv.lock.
inputs:
  sync:
    description: Whether to sync the workspace; jobs that only run PEP 723 scripts can skip it.
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Sync the workspace
      if: inputs.sync == 'true'
      shell: bash
      run: uv sync --locked
