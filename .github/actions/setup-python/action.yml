name: Set up Python
description: Install uv with a dependency cache and sync the uv workspace from uv.lock.
inputs:
  sync:
    description: Whether to sync the workspace; jobs that only run PEP 723 scripts can skip it.
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Sync the workspace
      if: inputs.sync == 'true'
      shell: bash
      run: uv sync --locked
