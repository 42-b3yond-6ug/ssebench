name: Set up Python
description: Install uv with a dependency cache and sync the uv workspace from uv.lock.
inputs:
  sync:
    description: Whether to sync the workspace; jobs that only run PEP 723 scripts can skip it.
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Sync the workspace
      if: inputs.sync == 'true'
      shell: bash
      run: uv sync --locked
