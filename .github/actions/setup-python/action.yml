name: Set up Python
description: Install uv with a dependency cache and sync the uv workspace from uv.lock.
inputs:
  sync:
    description: Whether to sync the workspace; jobs that only run PEP 723 scripts can skip it.
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Sync the workspace
      if: inputs.sync == 'true'
      shell: bash
      run: uv sync --locked
