version: 2

# The project is in security-only maintenance. The package ecosystems get no
# version updates (open-pull-requests-limit: 0), only security updates, which
# dependabot-automerge.yml merges once ci-ok passes. Docker images have no
# security updates, and ci-ok builds no image, so docker and GitHub Actions
# keep monthly version updates that a maintainer merges by hand.

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The SDK's build-system floor is the first setuptools with SPDX license
      # expressions, not the latest release.
      - dependency-name: setuptools
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
    groups:
      rust-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /catalog
      - /runtime/entrypoint
      - /webui/pty-proxy
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      javascript-security:
        applies-to: security-updates
        patterns: ["*"]

  # images/base-images is left out: those images pin the compilers that the
  # dataset's tasks are built and graded with, so they change with the dataset.
  - package-ecosystem: docker
    directories:
      - /catalog
      - /images/litellm
      - /images/runtime
      - /images/sidecar-agent
      - /images/sidecar-case
      - /webui
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The rust image tags follow rust-toolchain.toml and move with it.
      - dependency-name: rust
    groups:
      docker:
        patterns: ["*"]

  # The sandbox's Python venvs are copied into case images built on the base
  # images, so their build stage stays on the base images' Ubuntu release.
  - package-ecosystem: docker
    directory: /images/sandbox
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: rust
      - dependency-name: ubuntu
    groups:
      docker:
        patterns: ["*"]
