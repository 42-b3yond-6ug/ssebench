version: 2


updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directories:
      - /catalog
      - /runtime/entrypoint
      - /webui/pty-proxy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # ESLint 10 moves together with eslint-plugin-react-hooks 7, whose
      # React Compiler rules flag effects the web UI would have to rework.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      - dependency-name: eslint-plugin-react-hooks
        update-types: [version-update:semver-major]
    groups:
      javascript:
        patterns: ["*"]
        update-types: [minor, patch]

  # images/base-images is left out: those images pin the compilers that the
  # dataset's tasks are built and graded with, so they change with the dataset.
  - package-ecosystem: docker
    directories:
      - /catalog
      - /images/litellm
      - /images/runtime
      - /images/sidecar-agent
      - /images/sidecar-case
      - /webui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The rust image tags follow rust-toolchain.toml and move with it.
      - dependency-name: rust
    groups:
      docker:
        patterns: ["*"]

  # The sandbox's Python venvs are copied into case images built on the base
  # images, so their build stage stays on the base images' Ubuntu release.
  - package-ecosystem: docker
    directory: /images/sandbox
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: rust
      - dependency-name: ubuntu
    groups:
      docker:
        patterns: ["*"]
