name: Binaries

# Builds the release binaries for linux/amd64 and linux/arm64 and uploads them,
# with SHA256SUMS, as the artifact named by the `artifact` output:
#   ssebench-daemon-linux-<arch>      static musl build of sdk/daemon
#   ssebench-entrypoint-linux-<arch>  runtime/entrypoint
#   ssebench-catalog-linux-<arch>     catalog
#   ssebench-pty-proxy-linux-<arch>   webui/pty-proxy
# The daemon and the entrypoint are the files in the runtime image, built by
# the same Dockerfile. A release workflow calls this one and attaches the
# artifact to the GitHub release.

on:
  pull_request:
    paths:
      - .github/workflows/binaries.yml
      - VERSION
      - Cargo.toml
      - Cargo.lock
      - go.work
      - sdk/daemon/**
      - runtime/entrypoint/**
      - catalog/**
      - webui/pty-proxy/**
      - images/runtime/**
  push:
    branches: [main]
    paths:
      - .github/workflows/binaries.yml
      - VERSION
      - Cargo.toml
      - Cargo.lock
      - go.work
      - sdk/daemon/**
      - runtime/entrypoint/**
      - catalog/**
      - webui/pty-proxy/**
      - images/runtime/**
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact:
        description: Name of the artifact that holds the binaries and SHA256SUMS.
        value: ${{ jobs.binaries.outputs.artifact }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binaries:
    name: Build the binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read VERSION
        id: version
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=ssebench-binaries-$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the daemon and the entrypoint
        # Cross-compiled on the runner's platform; see images/runtime/Dockerfile.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=${{ runner.temp }}/runtime
          provenance: false
          sbom: false
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            catalog/go.sum
            webui/pty-proxy/go.sum
      - name: Build the catalog and pty-proxy, and collect everything
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RUNTIME: ${{ runner.temp }}/runtime
        run: |
          mkdir dist
          ldflags="-s -w -X main.version=$VERSION"
          for arch in amd64 arm64; do
            cp "$RUNTIME/linux_$arch/ssebench/ssebench-daemon" "dist/ssebench-daemon-linux-$arch"
            cp "$RUNTIME/linux_$arch/usr/local/bin/entrypoint" "dist/ssebench-entrypoint-linux-$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -C catalog -trimpath -ldflags="$ldflags" \
              -o "$PWD/dist/ssebench-catalog-linux-$arch" ./cmd/ssebench-catalog
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -C webui/pty-proxy -trimpath -ldflags="$ldflags" \
              -o "$PWD/dist/ssebench-pty-proxy-linux-$arch" .
          done
          chmod +x dist/*
          (cd dist && sha256sum -- * > SHA256SUMS)
          file dist/*
          cat dist/SHA256SUMS
      - name: The binaries report VERSION
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=0
          for bin in dist/*-linux-amd64; do
            # Each program ends its --version line with the version.
            out=$("$bin" --version)
            echo "$bin: $out"
            case "$out" in
              *" $VERSION") ;;
              *) echo "::error::$bin reports '$out', not $VERSION"; status=1 ;;
            esac
          done
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
