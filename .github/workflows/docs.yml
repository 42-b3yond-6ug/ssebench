name: Docs

# Builds the VitePress site and deploys it to GitHub Pages. A push to main that
# touches the docs deploys; the Release workflow calls this one for a release
# tag, and a manual run from main deploys too. Every other run only builds the
# site and keeps it as the `github-pages` artifact. Pull requests are built by
# CI. Nothing deploys while the repository is private.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - VERSION
      - package.json
      - bun.lock
      - bunfig.toml
      - docs/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the site without deploying it.
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        description: Build the site without deploying it.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One deployment at a time; a queued deployment waits instead of cancelling
  # the one in progress.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    # A push to a private main has nothing to deploy, and CI already builds the
    # site for pull requests.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: vitepress build
        run: bun run --cwd docs build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only main and release tags deploy, whichever workflow started the run.
    if: >-
      ${{ !github.event.repository.private && !inputs.dry_run
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the site
      id-token: write # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
