name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Each push to main gets its own group, so a queued main run is never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      webui: ${{ steps.filter.outputs.webui }}
      docs: ${{ steps.filter.outputs.docs }}
      dataset: ${{ steps.filter.outputs.dataset }}
      sdk: ${{ steps.filter.outputs.sdk }}
      e2e: ${{ steps.filter.outputs.e2e }}
      versions: ${{ steps.filter.outputs.versions }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      # Pull requests are diffed through the API; pushes to main need the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
              - .github/actions/**
            python:
              - *workflow
              - VERSION
              - pyproject.toml
              - uv.lock
              - bench/**
              - runtime/evaluator/**
              - runtime/mcp/**
              - runtime/plugins/**
              - sdk/python/**
              - sdk/tests/integration/**
              - agents/**
              - images/litellm/**
              - tools/dataset/**
              - tools/docs/**
              - tools/release/**
              - tools/report/**
              - tests/**
              - docs/reference/**
            rust:
              - *workflow
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - rustfmt.toml
              - sdk/daemon/**
            go:
              - *workflow
              - go.work
              - go.work.sum
              - catalog/**
              - runtime/entrypoint/**
              - webui/pty-proxy/**
            webui:
              - *workflow
              - package.json
              - bun.lock
              - bunfig.toml
              - webui/**
              - '!webui/pty-proxy/**'
            docs:
              - *workflow
              - package.json
              - bun.lock
              - bunfig.toml
              - docs/**
            dataset:
              - *workflow
              - datasets/**
              - tools/dataset/**
              - bench/src/ssebench/tasks/**
            sdk:
              - *workflow
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - sdk/**
            e2e:
              - *workflow
              - VERSION
              - pyproject.toml
              - uv.lock
              - Cargo.toml
              - Cargo.lock
              - bench/**
              - runtime/**
              - images/**
              - sdk/**
              - agents/**
              - models/**
              - deploy/compose/**
              - datasets/pilot/gjson-196-bf4efcb/**
              - tests/e2e/**
              - tests/integrity/**
            versions:
              - *workflow
              - VERSION
              - tools/release/**
              - rust-toolchain.toml
              - uv.lock
              - Cargo.lock
              - bun.lock
              - '**/pyproject.toml'
              - '**/Cargo.toml'
              - '**/package.json'
              - '**/Dockerfile'
              - deploy/compose/**
              - '!datasets/**'
            # Only the flake itself: the other jobs cover the sources, and a
            # full flake check costs about 20 runner minutes.
            nix:
              - flake.nix
              - flake.lock
              - nix/**

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push that creates the branch has no previous commit; scan its whole history.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$range" .

  versions:
    name: Version pins
    needs: changes
    if: needs.changes.outputs.versions == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          sync: "false"
      - name: Every component carries VERSION
        run: uv run tools/release/bump.py --check
      - name: The rust images match rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          # The base images pin the Rust that tasks are built with, which is independent.
          pins=$(git ls-files -- '*Dockerfile' ':!:datasets/**' ':!:images/base-images/**' \
            | xargs grep -noE 'rust:[0-9][0-9.]*' | sed 's/:rust:/:/')
          if [ -z "$channel" ] || [ -z "$pins" ]; then
            echo "::error::No Rust channel in rust-toolchain.toml or no rust image in the Dockerfiles."
            exit 1
          fi
          status=0
          while IFS=: read -r file line tag; do
            if [ "$tag" = "$channel" ]; then
              echo "$file:$line rust:$tag"
            else
              echo "::error file=$file,line=$line::rust:$tag does not match rust-toolchain.toml ($channel)"
              status=1
            fi
          done <<< "$pins"
          exit "$status"

  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TYPST_VERSION: 0.14.2
      TYPST_SHA256: a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install typst
        # The report test renders the PDF report, and is skipped without typst.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/typst.tar.xz" \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/typst"
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP/typst" --strip-components=1
          echo "$RUNNER_TEMP/typst" >> "$GITHUB_PATH"
      - name: ruff check
        run: uv run ruff check --output-format=github
      - name: ruff format
        run: uv run ruff format --check
      - name: basedpyright
        run: uv run basedpyright
      - name: pytest
        run: uv run pytest

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            catalog/go.sum
            runtime/entrypoint/go.sum
            webui/pty-proxy/go.sum
      - name: gofmt
        run: |
          unformatted=$(go list -m -f '{{.Dir}}' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet work
      - name: go test
        run: go test work

  webui:
    name: Web UI
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: tsc and vite build
        run: bun run --cwd webui build
      - name: bun test
        working-directory: webui
        run: bun test
      - name: prettier
        run: bun run --cwd webui format:check
      - name: eslint
        run: bun run --cwd webui lint

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-python
      - name: The generated reference pages are up to date
        run: uv run tools/docs/reference.py --check
      - name: vitepress build
        run: bun run --cwd docs build

  dataset:
    name: Dataset
    needs: changes
    if: needs.changes.outputs.dataset == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Task configs are valid
        run: uv run ssebench dataset validate datasets/pilot
      - name: manifest.json is up to date
        run: uv run ssebench dataset manifest --check
      - name: images.lock.json is consistent with the dataset
        run: uv run ssebench dataset lock --check
      - name: The task config schema is up to date
        run: uv run ssebench dataset schema --check
      - name: THIRD_PARTY.md is up to date
        run: uv run python tools/dataset/third_party.py --check

  sdk-integration:
    name: SDK integration
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sdk/tests/integration/Dockerfile
          tags: ssebench-sdk-integration
          load: true
          cache-from: type=gha,scope=sdk-integration
          cache-to: type=gha,mode=max,scope=sdk-integration
      - name: Run the SDK against the daemon
        run: docker run --rm ssebench-sdk-integration

  e2e:
    name: End-to-end smoke run
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # A prefix that no registry serves, so every image comes from this checkout.
      SSEBENCH_REGISTRY: ssebench-ci
      TASK: gjson-196-bf4efcb
      MODEL: claude-sonnet-4-6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Switch Docker to the containerd image store
        # With it, the default builder, which the CLI uses and which can see
        # local images, can import and export the GitHub Actions build cache.
        run: |
          config=/etc/docker/daemon.json
          current=$(sudo cat "$config" 2>/dev/null || echo '{}')
          echo "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$config"
          sudo systemctl restart docker
          docker info -f '{{ .DriverStatus }}'
      - name: Build the daemon stage from the cache
        # The release build of the daemon dominates the run; building this
        # stage first leaves it in the local cache for the CLI's sandbox build.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/sandbox/Dockerfile
          target: daemon-builder
          builder: default
          load: true
          tags: ${{ env.SSEBENCH_REGISTRY }}/cache/daemon-builder
          cache-from: type=gha,scope=sandbox-daemon
          cache-to: type=gha,mode=max,scope=sandbox-daemon
      - name: Build the Go base image
        run: make -C images/base-images generic-go
      - name: Write .env with generated secrets
        # As `just setup` does; the dummy agent never calls a model, so no provider key is needed.
        run: |
          secret() { head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
          sed -e "s|^LITELLM_MASTER_KEY=.*|LITELLM_MASTER_KEY=sk-$(secret)|" \
              -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(secret)|" \
              .env.example > .env
      - name: Run the dummy agent in the sandbox
        run: uv run ssebench run --model "$MODEL" --agent dummy --task "$TASK" --mode sandbox --local datasets/pilot
      - name: Check the graded result
        run: |
          result="results/$TASK/$MODEL/dummy/result.json"
          jq . "$result"
          # The unpatched project must build and its PoC must still fail.
          jq -e '.patch_result.build_success and .patch_result.pov_total > 0 and .patch_result.pov_passed == 0' "$result"
      - name: Integrity bypass tests
        # Against the tool image the run built. Script mode fails when that
        # image is missing, where pytest would skip.
        run: uv run python tests/integrity/test_bypass.py
      - name: Run the dummy agent in sidecar mode
        env:
          SSEBENCH_SMOKE_TASK: ${{ env.TASK }}
          SSEBENCH_SMOKE_MODEL: ${{ env.MODEL }}
        run: tests/e2e/smoke.sh sidecar
      - name: Integrity bypass tests in sidecar mode
        # Against the images the sidecar run built.
        run: uv run python tests/integrity/test_bypass.py --mode sidecar
      - name: Check the host
        if: always()
        continue-on-error: true
        run: uv run ssebench doctor
      - name: Show the LiteLLM logs
        if: failure()
        run: docker compose --env-file .env -f deploy/compose/docker-compose.yaml logs --no-color --tail 200
      - name: Upload the run directory
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: results/
          retention-days: 7

  nix:
    # Not part of ci-ok: a lockfile update can need its Nix hashes refreshed,
    # which should not block the update itself.
    name: Nix flake check (informational)
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: nix flake check
        run: nix flake check -L

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, secrets, versions, python, rust, go, webui, docs, dataset, sdk-integration, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
