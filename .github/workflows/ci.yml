name: CI

# The light gate of a pull request: lint, unit tests, the docs build and the
# dataset, version and chart checks, aggregated by ci-ok. The heavy checks (the
# end-to-end runs, the SDK integration test, the kind install, the Nix flake
# check, the image and binary builds and the dataset verification) run from
# verify.yml, helm.yml, images.yml, binaries.yml and dataset.yml on release
# tags, weekly and on demand, and before review with `just verify`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Each push to main gets its own group, so a queued main run is never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      webui: ${{ steps.filter.outputs.webui }}
      docs: ${{ steps.filter.outputs.docs }}
      dataset: ${{ steps.filter.outputs.dataset }}
      helm: ${{ steps.filter.outputs.helm }}
      versions: ${{ steps.filter.outputs.versions }}
    steps:
      # Pull requests are diffed through the API; pushes to main need the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
              - .github/actions/**
            python:
              - *workflow
              - VERSION
              - pyproject.toml
              - uv.lock
              - bench/**
              - runtime/evaluator/**
              - runtime/mcp/**
              - runtime/plugins/**
              - sdk/python/**
              - sdk/tests/integration/**
              - agents/**
              - images/litellm/**
              - tools/dataset/**
              - tools/docs/**
              - tools/release/**
              - tools/report/**
              - tests/**
              - docs/reference/**
              # The chart's tests compare it with the RBAC manifest and the docs.
              - deploy/helm/**
              - deploy/k8s/**
              - docs/deployment/kubernetes.md
            rust:
              - *workflow
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - rustfmt.toml
              - sdk/daemon/**
            go:
              - *workflow
              - go.work
              - go.work.sum
              - catalog/**
              - runtime/entrypoint/**
              - webui/pty-proxy/**
            webui:
              - *workflow
              - package.json
              - bun.lock
              - bunfig.toml
              - webui/**
              - '!webui/pty-proxy/**'
            docs:
              - *workflow
              - package.json
              - bun.lock
              - bunfig.toml
              - docs/**
            dataset:
              - *workflow
              - datasets/**
              - tools/dataset/**
              - bench/src/ssebench/tasks/**
            helm:
              - *workflow
              - VERSION
              - deploy/helm/**
            versions:
              - *workflow
              - VERSION
              - tools/release/**
              - rust-toolchain.toml
              - uv.lock
              - Cargo.lock
              - bun.lock
              - '**/pyproject.toml'
              - '**/Cargo.toml'
              - '**/package.json'
              - '**/Dockerfile'
              - deploy/compose/**
              - deploy/helm/**
              - '!datasets/**'

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push that creates the branch has no previous commit; scan its whole history.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$range" .

  versions:
    name: Version pins
    needs: changes
    if: needs.changes.outputs.versions == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          sync: "false"
      - name: Every component carries VERSION
        run: uv run tools/release/bump.py --check
      - name: The rust images match rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          # The base images pin the Rust that tasks are built with, which is independent.
          pins=$(git ls-files -- '*Dockerfile' ':!:datasets/**' ':!:images/base-images/**' \
            | xargs grep -noE 'rust:[0-9][0-9.]*' | sed 's/:rust:/:/')
          if [ -z "$channel" ] || [ -z "$pins" ]; then
            echo "::error::No Rust channel in rust-toolchain.toml or no rust image in the Dockerfiles."
            exit 1
          fi
          status=0
          while IFS=: read -r file line tag; do
            if [ "$tag" = "$channel" ]; then
              echo "$file:$line rust:$tag"
            else
              echo "::error file=$file,line=$line::rust:$tag does not match rust-toolchain.toml ($channel)"
              status=1
            fi
          done <<< "$pins"
          exit "$status"

  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TYPST_VERSION: 0.14.2
      TYPST_SHA256: a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install typst
        # The report test renders the PDF report, and is skipped without typst.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/typst.tar.xz" \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/typst"
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP/typst" --strip-components=1
          echo "$RUNNER_TEMP/typst" >> "$GITHUB_PATH"
      - name: ruff check
        run: uv run ruff check --output-format=github
      - name: ruff format
        run: uv run ruff format --check
      - name: basedpyright
        run: uv run basedpyright
      - name: pytest
        run: uv run pytest

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            catalog/go.sum
            runtime/entrypoint/go.sum
            webui/pty-proxy/go.sum
      - name: gofmt
        run: |
          unformatted=$(go list -m -f '{{.Dir}}' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet work
      - name: go test
        run: go test work

  webui:
    name: Web UI
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: tsc and vite build
        run: bun run --cwd webui build
      - name: bun test
        working-directory: webui
        run: bun test
      - name: prettier
        run: bun run --cwd webui format:check
      - name: eslint
        run: bun run --cwd webui lint

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-python
      - name: The generated reference pages are up to date
        run: uv run tools/docs/reference.py --check
      - name: vitepress build
        run: bun run --cwd docs build

  dataset:
    name: Dataset
    needs: changes
    if: needs.changes.outputs.dataset == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Task configs are valid
        run: uv run ssebench dataset validate datasets/pilot
      - name: manifest.json is up to date
        run: uv run ssebench dataset manifest --check
      - name: images.lock.json is consistent with the dataset
        run: uv run ssebench dataset lock --check
      - name: The task config schema is up to date
        run: uv run ssebench dataset schema --check
      - name: THIRD_PARTY.md is up to date
        run: uv run python tools/dataset/third_party.py --check

  helm:
    name: Helm chart
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: 0.7.0
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
      # The Kubernetes version of the node image of the kind release that helm.yml installs.
      KUBERNETES_VERSION: 1.35.0
      CHART: deploy/helm/ssebench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-helm
      - name: Install kubeconform
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: helm lint
        run: |
          helm lint "$CHART" --strict
          for values in "$CHART"/ci/*.yaml; do
            helm lint "$CHART" --strict --values "$values"
          done
      - name: kubeconform
        # Every variant renders to manifests that the Kubernetes schemas accept.
        run: |
          render() { helm template ssebench "$CHART" --namespace ssebench "$@" | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION"; }
          render
          for values in "$CHART"/ci/*.yaml; do
            echo "== $values"
            render --values "$values"
          done
      - name: The chart packages at the repository version
        run: |
          helm package "$CHART" --destination "$RUNNER_TEMP/chart" --version "$(cat VERSION)" --app-version "$(cat VERSION)"
          ls "$RUNNER_TEMP/chart"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, secrets, versions, python, rust, go, webui, docs, dataset, helm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
