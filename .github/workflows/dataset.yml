name: Dataset

# Grades pilot tasks with `ssebench dataset verify`: the reference agent's
# upstream fix must pass every check, and the dummy agent's unmodified project
# must build and pass its tests while every PoC still triggers the bug.
#
# A release tag, the weekly run and a manual run verify every task, or the
# tasks named by a manual run; the weekly run and a release tag are skipped
# while the repository is private, to save minutes. Pull requests do not run
# this workflow: verify the tasks a change touches before review with
# `just dataset-verify --changed-since origin/main` (`just verify dataset`).
# The config, manifest and schema checks run in the CI workflow.
#
# A release tag (v*) and a manual run with `publish` also push the case image of
# each task that passes to ghcr.io/<owner>/<repo>/case/<dataset>/<task>, tagged
# with the dataset version and with the version and the commit. It is the image
# that the verification graded, not a rebuild. The weekly run only verifies, so
# the version tag moves only when someone publishes. A run that publishes writes
# the digests it pushed to images.lock.json, an artifact that a release tag also
# attaches to the release; see docs/contributing/releasing.md. Nothing is pushed
# while the repository is private, from a branch other than main, or from a pull
# request.

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      tasks:
        description: Tasks to verify, separated by spaces; empty for every task.
        default: ""
      publish:
        description: Push the case images of the tasks that pass, with an images lock. Only from main, and only when the repository is public.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # A prefix that no registry serves, so every image comes from this checkout.
  SSEBENCH_REGISTRY: ssebench-ci
  DATASET: datasets/pilot
  OUTPUT: results/dataset-verify

jobs:
  plan:
    name: Select tasks
    # The weekly run and a release tag verify every task, which is not worth the minutes of a private repository.
    if: ${{ (github.event_name != 'schedule' && github.event_name != 'push') || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
      count: ${{ steps.select.outputs.count }}
      publish: ${{ steps.select.outputs.publish }}
      registry: ${{ steps.select.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag check looks for the tagged commit in main.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Select the tasks
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PRIVATE: ${{ github.event.repository.private }}
          REPOSITORY: ${{ github.repository }}
          TASKS: ${{ inputs.tasks }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          verify() { uv run ssebench dataset verify --dir "$DATASET" --list "$@"; }
          case "$EVENT" in
            schedule)
              # The payload of a scheduled run need not describe the
              # repository, so the job condition alone may not see that it is
              # private.
              if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != false ]; then
                echo "The repository is private; skipping the weekly run."
                tasks="[]"
              else
                tasks=$(verify)
              fi ;;
            *)
              # shellcheck disable=SC2086 # the input is a list of task names
              tasks=$(verify $TASKS) ;;
          esac

          publish=false
          case "$EVENT" in
            push) publish=true ;;
            workflow_dispatch) [ "$PUBLISH_INPUT" != true ] || publish=true ;;
          esac
          if [ "$publish" = true ] && [ "$PRIVATE" = true ]; then
            echo "The repository is private; no image will be published."
            publish=false
          fi
          if [ "$publish" = true ]; then
            case "$REF" in
              refs/heads/main) ;;
              refs/tags/v*)
                version=$(cat VERSION)
                if [ "$REF" != "refs/tags/v$version" ]; then
                  echo "::error::Tag ${REF#refs/tags/} does not match VERSION ($version)."
                  exit 1
                fi
                if ! git merge-base --is-ancestor "$SHA" origin/main; then
                  echo "::error::Tag ${REF#refs/tags/} is not on main."
                  exit 1
                fi ;;
              *)
                echo "::error::Images are published from main or from a release tag, not from $REF."
                exit 1 ;;
            esac
          fi

          {
            echo "tasks=$tasks"
            echo "count=$(jq length <<< "$tasks")"
            echo "publish=$publish"
            echo "registry=ghcr.io/${REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$publish"
          jq -r '.[] | "\(.task) on \(.base)"' <<< "$tasks"

  verify:
    name: ${{ matrix.task.task }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    # The C tasks with AddressSanitizer build and test their projects several
    # times per run; CPython runs most of its test suite.
    timeout-minutes: 240
    permissions:
      contents: read
      # Only the login and the push of a publishing run use it. A pull request
      # from a fork gets a read-only token whatever is declared here.
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      TASK: ${{ matrix.task.task }}
      BASE: ${{ matrix.task.base }}
    steps:
      - name: Free disk space
        # The largest case images are 3.4 GB, and each run adds a tool layer
        # and copies of the built project.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Switch Docker to the containerd image store
        # With it, the default builder, which the CLI uses and which can see
        # local images, can import and export the GitHub Actions build cache.
        run: |
          config=/etc/docker/daemon.json
          current=$(sudo cat "$config" 2>/dev/null || echo '{}')
          echo "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$config"
          sudo systemctl restart docker
          docker info -f '{{ .DriverStatus }}'
      - name: Locate the base image
        id: base
        run: |
          name=${BASE%%[:@]*}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "dir=${name#base-}" >> "$GITHUB_OUTPUT"
      - name: Build the base image from the cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/base-images
          file: images/base-images/${{ steps.base.outputs.dir }}/Dockerfile
          builder: default
          load: true
          tags: ${{ env.SSEBENCH_REGISTRY }}/${{ matrix.task.base }}
          cache-from: type=gha,scope=${{ steps.base.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.base.outputs.name }}
      - name: Build the daemon stage from the cache
        # The release build of the daemon dominates the tool layer; building
        # this stage first leaves it in the local cache for the CLI's build.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/sandbox/Dockerfile
          target: daemon-builder
          builder: default
          load: true
          tags: ${{ env.SSEBENCH_REGISTRY }}/cache/daemon-builder
          cache-from: type=gha,scope=sandbox-daemon
          cache-to: type=gha,mode=max,scope=sandbox-daemon
      - name: Write .env with generated secrets
        # As `just setup` does; the reference and dummy agents never call a model.
        run: |
          secret() { head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
          sed -e "s|^LITELLM_MASTER_KEY=.*|LITELLM_MASTER_KEY=sk-$(secret)|" \
              -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(secret)|" \
              .env.example > .env
      - name: Verify the task
        # A retry covers a case image build that loses the network, not a failed check.
        run: uv run ssebench dataset verify --dir "$DATASET" --output "$OUTPUT" --jobs 1 --retries 1 "$TASK"
      - name: Log in to the registry
        # After the verification, so that the run of the task's own scripts never sees the credentials.
        if: needs.plan.outputs.publish == 'true' && !github.event.repository.private
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the verified image
        # Runs only when the task passed. It pushes the image that both runs graded, and refuses one that was rebuilt since.
        if: needs.plan.outputs.publish == 'true' && !github.event.repository.private
        env:
          REGISTRY: ${{ needs.plan.outputs.registry }}
        run: uv run ssebench dataset publish --dir "$DATASET" --output "$OUTPUT" --registry "$REGISTRY" --revision "$GITHUB_SHA" "$TASK"
      - name: Upload the publication record
        if: needs.plan.outputs.publish == 'true' && !github.event.repository.private
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataset-published-${{ matrix.task.task }}
          path: ${{ env.OUTPUT }}/published/
          if-no-files-found: error
          retention-days: 30
      - name: Annotate the failures
        if: failure()
        run: |
          result="$OUTPUT/tasks/$TASK.json"
          if [ -f "$result" ]; then
            jq -r '.failures[]' "$result" | while IFS= read -r line; do
              echo "::error title=$TASK::$line"
            done
          else
            echo "::error title=$TASK::The verification wrote no result; see the step logs."
          fi
          df -h /
      - name: Upload the task result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataset-verify-result-${{ matrix.task.task }}
          path: ${{ env.OUTPUT }}/tasks/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload the run logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataset-verify-logs-${{ matrix.task.task }}
          path: |
            ${{ env.OUTPUT }}/logs/
            ${{ env.OUTPUT }}/runs/results/**/*.log
            ${{ env.OUTPUT }}/runs/results/**/*.patch
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Summary
    needs: [plan, verify]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dataset-verify-result-*
          path: ${{ env.OUTPUT }}/tasks
          merge-multiple: true
      - name: Summarize
        env:
          TASKS: ${{ needs.plan.outputs.tasks }}
        run: |
          # A selected task without a result counts as failed.
          mapfile -t names < <(jq -r '.[].task' <<< "$TASKS")
          status=0
          uv run ssebench dataset verify --dir "$DATASET" --output "$OUTPUT" --summarize "${names[@]}" \
            > /dev/null || status=$?
          cat "$OUTPUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataset-verify-summary
          path: |
            ${{ env.OUTPUT }}/summary.md
            ${{ env.OUTPUT }}/summary.json
          if-no-files-found: ignore
          retention-days: 90

  lock:
    name: Images lock
    needs: [plan, verify]
    # Tasks that failed are not in it, and the others are, so it runs after a failed verification too.
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.plan.outputs.count != '0' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # There is nothing to download when no task was published.
        continue-on-error: true
        with:
          pattern: dataset-published-*
          path: ${{ env.OUTPUT }}/published
          merge-multiple: true
      - name: Write the images lock
        run: |
          shopt -s nullglob
          records=("$OUTPUT"/published/*.json)
          if [ ${#records[@]} -eq 0 ]; then
            echo "::warning::No task was published, so there is no images lock."
            exit 0
          fi
          # The lock in the checkout, with the images of this run on top.
          uv run ssebench dataset lock "$DATASET" --records "$OUTPUT/published" -o "$OUTPUT/images.lock.json"
          {
            echo "## Images lock"
            echo
            echo "This run published ${#records[@]} case images. The lock pins $(jq '.images | length' "$OUTPUT/images.lock.json")"
            echo "of the dataset's tasks by digest; it is the artifact \`images-lock\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images-lock
          path: ${{ env.OUTPUT }}/images.lock.json
          if-no-files-found: ignore
          retention-days: 90

  attach-lock:
    name: Attach the images lock to the release
    needs: [plan, lock]
    if: ${{ needs.lock.result == 'success' && github.ref_type == 'tag' && needs.plan.outputs.publish == 'true' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # upload to the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: images-lock
          path: assets
      - name: Attach the lock to the release
        run: |
          if [ ! -f assets/images.lock.json ]; then
            echo "::warning::There is no images lock to attach."
            exit 0
          fi
          # The Release workflow creates the release for this tag, and is long done by now;
          # this only covers a run that was started by hand on a tag it has not released.
          for _ in $(seq 40); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            sleep 60
          done
          gh release upload "$TAG" assets/images.lock.json --clobber
