name: Helm

# Installs the Helm chart in deploy/helm/ssebench on a kind cluster with
# Calico, which enforces NetworkPolicy, using images built from the checkout,
# and passes one pilot task with the `reference` agent on the Kubernetes
# backend, from `ssebench run` and from the web UI (tests/helm/smoke.sh). It
# builds several images and a cluster, so it runs for release tags, every week
# on main and on demand (`gh workflow run helm.yml`), and only while the
# repository is public, where minutes are free. `just verify kind` does the
# same on your machine. Pull requests get the quick chart checks (lint,
# kubeconform, packaging) from the CI workflow. Publishing the chart is a job of
# release.yml.

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  KIND_VERSION: 0.31.0
  KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
  CALICO_VERSION: 3.31.0
  CHART: deploy/helm/ssebench

jobs:
  smoke:
    name: Install on kind and run a task
    # Builds several images and starts a cluster: a job for the public repository's free minutes.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # A prefix that no registry serves, so every image comes from this checkout.
      SSEBENCH_REGISTRY: ssebench-ci
      CLUSTER: ssebench
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-helm
      - name: Install kind
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kind" "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $RUNNER_TEMP/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Write .env with generated secrets
        # `ssebench run` starts the LiteLLM proxy for the Docker run below; the
        # reference agent never calls a model.
        run: |
          secret() { head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
          sed -e "s|^LITELLM_MASTER_KEY=.*|LITELLM_MASTER_KEY=sk-$(secret)|" \
              -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(secret)|" \
              .env.example > .env
      - name: Build the images of the chart
        run: |
          version=$(cat VERSION)
          docker build -f images/litellm/Dockerfile -t "$SSEBENCH_REGISTRY/litellm:$version" .
          docker build -f catalog/Dockerfile --build-arg VERSION="$version" -t "$SSEBENCH_REGISTRY/catalog:$version" .
          docker build -f webui/Dockerfile --build-arg VERSION="$version" -t "$SSEBENCH_REGISTRY/webui:$version" .
      - name: Build the prebuilt image of the reference agent
        # A run on the local Docker daemon builds the case, tool and agent layers,
        # and grades the task there too.
        run: |
          make -C images/base-images generic-go
          uv run ssebench run --agent reference --task gjson-196-bf4efcb --mode sandbox --local datasets/pilot --run-id docker-baseline
          jq -e '.patch_result.status == "passed"' results/gjson-196-bf4efcb/none/reference/docker-baseline/result.json
      - name: Create the cluster
        # Calico enforces NetworkPolicy; kind's default network plugin does not.
        run: |
          kind create cluster --name "$CLUSTER" --config deploy/k8s/kind.yaml --wait 0
          kubectl apply -f "https://raw.githubusercontent.com/projectcalico/calico/v${CALICO_VERSION}/manifests/calico.yaml"
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
      - name: Load the images
        run: |
          version=$(cat VERSION)
          docker pull postgres:16
          kind load docker-image --name "$CLUSTER" \
            "$SSEBENCH_REGISTRY/litellm:$version" "$SSEBENCH_REGISTRY/catalog:$version" "$SSEBENCH_REGISTRY/webui:$version" \
            "$SSEBENCH_REGISTRY/agent-reference/gjson-196-bf4efcb:$version" postgres:16
      - name: Install the chart
        run: |
          kubectl create namespace ssebench-runs
          kubectl create namespace ssebench
          # Fake keys: the reference agent makes no model call.
          kubectl -n ssebench create secret generic provider-keys \
            --from-literal=ANTHROPIC_API_KEY=sk-not-a-real-key \
            --from-literal=OPENAI_API_KEY=sk-not-a-real-key \
            --from-literal=GOOGLE_API_KEY=not-a-real-key
          helm install ssebench "$CHART" --namespace ssebench --wait --timeout 10m \
            --set image.registry="$SSEBENCH_REGISTRY" --set image.pullPolicy=Never \
            --set runs.imagePullPolicy=Never --set runs.namespace=ssebench-runs \
            --set 'litellm.providerKeySecrets={provider-keys}'
      - name: Smoke test
        env:
          IMAGE_PULL_POLICY: Never
        run: |
          PROBE_IMAGE="$SSEBENCH_REGISTRY/litellm:$(cat VERSION)" tests/helm/smoke.sh
      - name: Show the cluster
        if: failure()
        run: |
          kubectl get pods,jobs,networkpolicy -A -o wide || true
          kubectl -n ssebench describe pods || true
          for deploy in litellm catalog webui; do
            kubectl -n ssebench logs "deploy/ssebench-$deploy" --tail=100 || true
          done
          kubectl -n ssebench-runs describe pods || true
      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER"
