{{- /* deploy/k8s/rbac.yaml has the same rules; tools/release/test_chart.py keeps the two equal. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ssebench.serviceAccountName" . }}
  labels: {{- include "ssebench.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ssebench.fullname" . }}-controller
  namespace: {{ include "ssebench.runsNamespace" . }}
  labels: {{- include "ssebench.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ssebench.fullname" . }}-controller
  namespace: {{ include "ssebench.runsNamespace" . }}
  labels: {{- include "ssebench.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ssebench.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ssebench.fullname" . }}-controller
{{- end }}
