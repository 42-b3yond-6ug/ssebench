{{- if .Values.postgres.enabled }}
{{- $name := include "ssebench.databaseService" . }}
{{- $selector := dict "component" "litellm-db" "root" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "ssebench.commonLabels" . | nindent 4 }}
    {{- include "ssebench.selector" $selector | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels: {{- include "ssebench.selector" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ssebench.commonLabels" . | nindent 8 }}
        {{- include "ssebench.selector" $selector | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "ssebench.imagePullSecrets" . | nindent 6 }}
      {{- include "ssebench.scheduling" . | nindent 6 }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: POSTGRES_DB, value: litellm}
            - {name: POSTGRES_USER, value: litellm}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "ssebench.authSecret" . }}, key: POSTGRES_PASSWORD}}
            # A subdirectory, because the root of a volume can hold lost+found, which initdb refuses.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, litellm, -d, litellm]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, litellm, -d, litellm]}
            periodSeconds: 30
            failureThreshold: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      {{- if not .Values.postgres.persistence.enabled }}
      volumes:
        - {name: data, emptyDir: {}}
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "ssebench.labels" . | nindent 4 }}
spec:
  selector: {{- include "ssebench.selector" $selector | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
{{- end }}
