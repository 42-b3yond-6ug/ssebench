{{- if not .Values.auth.existingSecret }}
{{- $name := include "ssebench.authSecret" . }}
{{- /* An upgrade keeps the values of the Secret that exists. */}}
{{- $old := dict }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old = .data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ssebench.labels" . | nindent 4 }}
type: Opaque
data:
  LITELLM_MASTER_KEY: {{ get $old "LITELLM_MASTER_KEY" | default (printf "sk-%s" (randAlphaNum 40) | b64enc) }}
  POSTGRES_PASSWORD: {{ get $old "POSTGRES_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  SSEBENCH_WEBUI_TOKEN: {{ get $old "SSEBENCH_WEBUI_TOKEN" | default (randAlphaNum 40 | b64enc) }}
{{- end }}
