# The LiteLLM proxy and its database. Start it with `just launch` or let
# `ssebench run` start it; both rebuild the proxy image when models/ changed.
# Container, network and volume names are scoped to the Compose project
# (COMPOSE_PROJECT_NAME, default ssebench), so stacks with different project
# names and LITELLM_PORT values run side by side.
name: ssebench

services:
  litellm:
    image: ${SSEBENCH_REGISTRY:-ghcr.io/42-b3yond-6ug/ssebench}/litellm:1.0.0-dev
    build:
      context: ../..
      dockerfile: images/litellm/Dockerfile
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is not set; run just setup to write .env}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; run just setup to write .env}@litellm_db:5432/litellm"
      STORE_MODEL_IN_DB: "True" # allows adding models to proxy via UI
    # Provider keys that models/*.yaml reference as os.environ/<NAME>.
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      - litellm_db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 http://localhost:4000/health/liveliness || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  litellm_db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      # Postgres applies the password only when it creates the volume.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; run just setup to write .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
