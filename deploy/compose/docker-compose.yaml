# The LiteLLM proxy and its database. Start it with `just launch` or let
# `ssebench run` start it; both rebuild the proxy image when models/ changed.
# Container, network and volume names are scoped to the Compose project
# (COMPOSE_PROJECT_NAME, default ssebench), so stacks with different project
# names and LITELLM_PORT values run side by side.
name: ssebench

services:
  litellm:
    image: ${SSEBENCH_REGISTRY:-ghcr.io/42-b3yond-6ug/ssebench}/litellm:1.0.0
    build:
      context: ../..
      dockerfile: images/litellm/Dockerfile
    ports:
      # The proxy holds the master key and the provider keys, so it is published
      # on loopback unless LITELLM_BIND says otherwise.
      - "${LITELLM_BIND:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is not set; run just setup to write .env}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; run just setup to write .env}@litellm_db:5432/litellm"
      STORE_MODEL_IN_DB: "True" # allows adding models to proxy via UI
    # Provider keys that models/*.yaml reference as os.environ/<NAME>. The CLI
    # sets SSEBENCH_ENV_FILE to the workspace's .env; from a checkout, this is
    # its .env.
    env_file:
      - path: ${SSEBENCH_ENV_FILE:-../../.env}
        required: false
    networks:
      # `default` is a normal bridge, so the proxy can reach model providers.
      # `agents` is internal: run containers on it reach the proxy but not the
      # internet (the default egress policy).
      - default
      - agents
    depends_on:
      - litellm_db
    healthcheck:
      # The image has Python but neither wget nor curl.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  litellm_db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      # Postgres applies the password only when it creates the volume.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; run just setup to write .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  # Project-scoped (<project>_agents), like the default network.
  agents:
    internal: true
