name: ssebench

services:
  litellm:
    image: ${SSEBENCH_REGISTRY:-ghcr.io/42-b3yond-6ug/ssebench}/litellm
    build:
      context: ../..
      dockerfile: images/litellm/Dockerfile
    ports:
      - "4000:4000"
    networks:
      - benchnet
    environment:
      DATABASE_URL: "postgresql://llmproxy:dbpassword9090@litellm_db:5432/litellm"
      STORE_MODEL_IN_DB: "True" # allows adding models to proxy via UI
    env_file:
      - ../../.env
    depends_on:
      - litellm_db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 http://localhost:4000/health/liveliness || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  litellm_db:
    image: postgres:16
    restart: always
    container_name: litellm_db
    networks:
      - benchnet
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: litellm_postgres_data

networks:
  benchnet:
    name: ssebench_net
