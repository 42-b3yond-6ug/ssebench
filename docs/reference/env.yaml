# Every environment variable SSEBench reads or sets.
#
# docs/reference/environment.md and the .env table of
# docs/reference/configuration.md are generated from this file
# (`just docs-gen`). `just docs-check` and the test in tools/docs fail when the
# source uses a variable that is missing here: any SSE_*, SSEBENCH_* or
# LITELLM_* word, and any name read through os.environ, os.Getenv, env::var,
# process.env, os.environ/ in a LiteLLM config or ${...} in a Compose file.
#
# Each variable has:
#   name         the variable.
#   section      where environment.md lists it; one key of `sections`, or a list.
#   used_by      the components that read it.
#   default      the value when it is unset; empty for none. Markdown.
#   description  what it does. Markdown.

sections:
  settings: SSEBench settings on the host, read from the environment or from .env
  kubernetes: Settings of the Kubernetes backend, read like the other settings
  providers: Keys of the model providers, read by the LiteLLM proxy
  container: Set in every task container by ssebench run and the entrypoint
  runtime: Settings of the components in the task container
  webui: Web UI server
  catalog: Catalog service
  development: Tests and development tools

variables:
  # SSEBench settings ---------------------------------------------------------
  - name: LITELLM_MASTER_KEY
    section: settings
    used_by: [CLI, LiteLLM proxy, web UI]
    default: generated by `just setup`
    description: >-
      Admin key of the local LiteLLM proxy; the CLI uses it to create a key for
      each run, and the web UI to make the key of a run's AI assistant. Required.
  - name: POSTGRES_PASSWORD
    section: settings
    used_by: [LiteLLM proxy]
    default: generated by `just setup`
    description: >-
      Password of the proxy's Postgres database; letters and digits only, as it
      is part of a URL. Postgres keeps the password it was created with, so after
      changing it remove the stack's volume. Required.
  - name: POSTGRES_USER
    section: settings
    used_by: [LiteLLM proxy]
    default: litellm
    description: User of the proxy's Postgres database.
  - name: LITELLM_PORT
    section: settings
    used_by: [CLI, LiteLLM proxy, web UI]
    default: "4000"
    description: Host port of the LiteLLM proxy.
  - name: LITELLM_BIND
    section: settings
    used_by: [Compose]
    default: 127.0.0.1
    description: >-
      Host address that the LiteLLM proxy's port is published on. The proxy holds
      the master key and the provider keys, so it listens on loopback only; set
      `0.0.0.0` to reach it from other machines, and only on a network you trust.
  - name: COMPOSE_PROJECT_NAME
    section: settings
    used_by: [CLI, Compose]
    default: ssebench
    description: >-
      Compose project of the proxy stack. Its containers, networks
      (`<project>_default`, and the internal `<project>_agents` that run
      containers join by default) and database volume (`<project>_postgres_data`)
      carry this name, so stacks with different names and ports run side by side.
  - name: SSEBENCH_REGISTRY
    section: [settings, catalog]
    used_by: [CLI, just, Compose, catalog service]
    default: ghcr.io/42-b3yond-6ug/ssebench
    description: >-
      Registry prefix of every image SSEBench builds or pulls, and of the image
      names that the catalog service returns.
  - name: SSEBENCH_CATALOG
    section: [settings, webui]
    used_by: [CLI, just, web UI]
    default: the bundled pilot manifest
    description: >-
      [Task catalog](/reference/cli#task-catalog) that `ssebench run`,
      `ssebench tasks list` and the web UI get tasks from: the path or URL of a
      `manifest.json`, a dataset directory, or the URL of a catalog service.
      `--catalog` overrides it.
  - name: SSEBENCH_IMAGES_LOCK
    section: [settings, catalog]
    used_by: [CLI, catalog service]
    default: "`images.lock.json` next to the manifest, if there is one"
    description: >-
      Path of the images lock that pins case images by digest, instead of the
      one next to the manifest: `ssebench run` and `ssebench-catalog serve`
      (`--lock`) use it, and `ssebench run` also takes a URL; see
      [Case images](/reference/cli#case-images). A lock that is missing or
      invalid is an error.
  - name: SSEBENCH_HOME
    section: settings
    used_by: [CLI]
    default: see [CLI](/reference/cli#working-directory)
    description: >-
      Directory that holds `agents/`, `images/`, `runtime/`, `models/`,
      `deploy/` and `datasets/`, normally the repository root. Unset, a package
      install without a clone uses the copy of these directories in the
      package.
  - name: SSEBENCH_ENV_FILE
    section: settings
    used_by: [CLI, Compose]
    default: "`.env` in the repository root"
    description: >-
      The `.env` file that the LiteLLM container reads provider keys from. The
      CLI sets it to the `.env` in the workspace; set it yourself only when you
      run `docker compose` on `deploy/compose/docker-compose.yaml` directly.
  - name: SSEBENCH_DEMO_PROJECT
    section: settings
    used_by: [CLI, Compose]
    default: ssebench-demo
    description: >-
      Compose project of the [demo](/getting-started/demo). It must differ from
      `COMPOSE_PROJECT_NAME`: `just demo-down` deletes the project's database
      volume, and the demo refuses to touch a project whose containers it did not
      create.
  - name: SSEBENCH_DEMO_WEBUI_PORT
    section: settings
    used_by: [CLI, Compose]
    default: "3001"
    description: Host port of the demo's web UI, on `127.0.0.1`.
  - name: SSEBENCH_DEMO_CATALOG_PORT
    section: settings
    used_by: [CLI, Compose]
    default: "8090"
    description: Host port of the demo's catalog service, on `127.0.0.1`.
  - name: SSEBENCH_BACKEND
    section: settings
    used_by: [CLI, web UI]
    default: docker
    description: >-
      Runner backend that `ssebench run` and `ssebench runs` use when `--backend`
      is not given: where the run's containers execute. The web UI runs those
      commands, so it works with the backend named here. Installed extensions can
      add backends; see [Runner backends](/concepts/runner-backends).
  - name: SSEBENCH_PREBUILT
    section: settings
    used_by: [CLI]
    default: unset
    description: >-
      `1`, `true`, `yes` or `on` makes `ssebench run` use the published agent
      images of the task, under `SSEBENCH_REGISTRY`, instead of building the
      case, tool and agent layers; the same as `--prebuilt`. See
      [Prebuilt images](/concepts/runner-backends#prebuilt-images).
  - name: SSEBENCH_EGRESS
    section: settings
    used_by: [CLI, web UI]
    default: restricted
    description: >-
      Network egress of a run when `--egress` is not given: `restricted` reaches
      the LiteLLM proxy and nothing else, `open` also has internet access. The
      web UI's launches use it unless the launch names a policy. The Helm chart
      sets it from `runs.egress`. See [Integrity and egress](/deployment/integrity-and-egress).
  - name: SSEBENCH_RUNTIME_IMAGE
    section: settings
    used_by: [CLI]
    default: "`<registry>/runtime:<version>` without a checkout, else unset"
    description: >-
      Runtime image that the tool layers copy the daemon and the entrypoint from,
      as `<registry>/runtime:<version>` does. Unset, a checkout compiles both from
      its sources, and an installation without a checkout uses the published image
      of its version. Set it to skip the compilation in a checkout. The image must
      exist for the platform of the run, which is `linux/amd64` for a `pilot` task.
  - name: SSEBENCH_VERSION
    section: settings
    used_by: [CLI, Compose]
    default: set by the CLI
    description: >-
      SSEBench version that the Compose files pass as the `VERSION` build
      argument of the images they build. The CLI sets it from `VERSION`; it only
      matters when you run `docker compose build` yourself.

  # Kubernetes backend --------------------------------------------------------
  - name: SSEBENCH_K8S_NAMESPACE
    section: kubernetes
    used_by: [CLI]
    default: the namespace of the kubeconfig context, or of the pod `ssebench` runs in, else `default`
    description: Namespace where the runs' Jobs, Secrets and NetworkPolicies are created.
  - name: SSEBENCH_K8S_CONTEXT
    section: kubernetes
    used_by: [CLI]
    default: the kubeconfig's current context
    description: >-
      Context of the kubeconfig to use. The kubeconfig itself is found the way
      `kubectl` finds it (`KUBECONFIG`, else `~/.kube/config`); inside a pod the
      backend uses the pod's service account.
  - name: SSEBENCH_K8S_PROXY_URL
    section: kubernetes
    used_by: [CLI]
    default: "`http://litellm.<proxy namespace>.svc:4000`"
    description: >-
      URL of the LiteLLM proxy as a run's pod reaches it: the run's `SSE_BASE_URL`.
      Its port must be the port the proxy's pods listen on, since the run's
      network policy opens that port.
  - name: SSEBENCH_K8S_PROXY_HOST_URL
    section: kubernetes
    used_by: [CLI]
    default: "the proxy's Service URL inside a cluster, else `http://localhost:$LITELLM_PORT`"
    description: >-
      URL of the LiteLLM proxy as the `ssebench` process reaches it, to create and
      read each run's key. From outside the cluster, forward the proxy's port
      (`kubectl port-forward svc/litellm 4000`) and set `LITELLM_PORT` or this.
  - name: SSEBENCH_K8S_PROXY_NAMESPACE
    section: kubernetes
    used_by: [CLI]
    default: the runs' namespace
    description: Namespace of the LiteLLM proxy, for its default URL and the run's network policy.
  - name: SSEBENCH_K8S_PROXY_SELECTOR
    section: kubernetes
    used_by: [CLI]
    default: "`app.kubernetes.io/name=litellm`"
    description: >-
      Labels of the LiteLLM proxy's pods, as `key=value,key=value`. A restricted
      run's network policy lets its pod reach the pods that match, and no others.
  - name: SSEBENCH_K8S_RUNTIME_CLASS
    section: kubernetes
    used_by: [CLI]
    default: unset
    description: >-
      `runtimeClassName` of the run's pod, for a sandboxed runtime such as gVisor
      or Kata Containers.
  - name: SSEBENCH_K8S_IMAGE_PULL_POLICY
    section: kubernetes
    used_by: [CLI]
    default: IfNotPresent
    description: >-
      `imagePullPolicy` of the run's containers. `IfNotPresent` uses an image that
      is already on the node, such as one loaded into a kind cluster.
  - name: SSEBENCH_K8S_IMAGE_PULL_SECRETS
    section: kubernetes
    used_by: [CLI]
    default: unset
    description: Names of image pull Secrets in the runs' namespace, separated by commas.
  - name: SSEBENCH_K8S_RESOURCES
    section: kubernetes
    used_by: [CLI]
    default: "`requests` of 1 CPU, 2Gi memory and 2Gi ephemeral storage; `limits` of 4 CPUs, 8Gi and 20Gi"
    description: >-
      Resource requests and limits of the task container, as JSON or YAML in the
      shape of a container's `resources`, for example
      `{"requests": {"cpu": "2"}, "limits": {"memory": "16Gi"}}`. It replaces the
      defaults as a whole.
  - name: SSEBENCH_K8S_TTL_SECONDS
    section: kubernetes
    used_by: [CLI]
    default: "3600"
    description: >-
      How long the cluster keeps a run's finished Job, its pod and its logs
      (`ttlSecondsAfterFinished`). A run kept with `--keep-container` has none.
  - name: SSEBENCH_K8S_DEADLINE_SLACK
    section: kubernetes
    used_by: [CLI]
    default: "1800"
    description: >-
      Seconds added to the run's `--timeout` to make the Job's
      `activeDeadlineSeconds`: the time for pulling images, starting and grading.
      When it runs out the cluster deletes the pod and the run's results with it.
  - name: KUBERNETES_SERVICE_HOST
    section: kubernetes
    used_by: [CLI]
    default: set by Kubernetes in every pod
    description: >-
      The backend takes its presence to mean that `ssebench` runs inside a
      cluster, where the proxy is reached through its Service.
  # Provider keys -------------------------------------------------------------
  - name: ANTHROPIC_API_KEY
    section: providers
    used_by: [LiteLLM proxy, CLI doctor, sse.ai]
    description: >-
      Key of the Anthropic models in `models/anthropic-claude.yaml`. `sse.ai`
      also uses it when it runs OpenCode outside a task container.
  - name: OPENAI_API_KEY
    section: providers
    used_by: [LiteLLM proxy, CLI doctor]
    description: Key of the OpenAI models in `models/openai-gpt.yaml`.
  - name: GOOGLE_API_KEY
    section: providers
    used_by: [LiteLLM proxy, CLI doctor]
    description: Key of the Gemini models in `models/google-gemini.yaml`.

  # Task container ------------------------------------------------------------
  - name: SSE_API_KEY
    section: container
    used_by: [agents, plugins, sse.ai]
    default: set by `ssebench run`
    description: The run's LiteLLM key, which can use only the selected model; empty in a reference run.
  - name: SSE_BASE_URL
    section: container
    used_by: [agents, plugins, sse.ai]
    default: set by `ssebench run`
    description: URL of the LiteLLM proxy, `http://litellm:4000`; empty in a reference run.
  - name: SSE_MODEL_NAME
    section: container
    used_by: [agents, plugins, sse.ai]
    default: set by `ssebench run`
    description: The selected model, as named in `models/*.yaml`; `none` in a reference run.
  - name: SSE_ARCHIVE
    section: container
    used_by: [entrypoint, daemon, evaluator, agents]
    default: /tmp/sse-archive
    description: >-
      The agent's archive directory, `/tmp/sse-archive`, writable by the agent:
      `dialog.jsonl` and whatever the agent side writes go there. The entrypoint
      requires it. The graded outputs go to `SSE_RESULTS` instead, root-only.
  - name: SSE_RESULTS
    section: container
    used_by: [entrypoint, daemon, evaluator]
    default: /var/lib/ssebench/results
    description: >-
      The run's results directory, root-only: the grade (`result.json`), the
      graded patch (`final.patch`), the commit log and the run's logs. Its
      parent is made `0700` root, so neither the agent nor the task runner can
      reach it. The CLI mounts the run directory here and its `archive/`
      subdirectory at `SSE_ARCHIVE`. Falls back to `SSE_ARCHIVE` when unset.
  - name: SSE_DIFFICULTY
    section: container
    used_by: [daemon, MCP server]
    default: "2"
    description: >-
      The [difficulty level](/concepts/difficulty-levels), from 0 to 4. The MCP server
      decides from it which checks `test_patch` runs, and the daemon refuses the
      withheld `bencher` actions on its agent-facing listeners.
  - name: TIMEOUT
    section: container
    used_by: [entrypoint, evaluator, agents]
    default: "`14400` in the entrypoint, `1800` in the evaluator"
    description: >-
      How long the agent may run, in seconds (`--timeout`). The evaluator uses
      the same limit for grading.
  - name: SSE_KEEP_ALIVE
    section: container
    used_by: [entrypoint]
    default: "0"
    description: >-
      `1` keeps the container running after grading (`--keep-container`), for
      the web UI.
  - name: SSE_PLUGINS
    section: container
    used_by: [entrypoint]
    default: the plugins `plugins.yaml` enables
    description: >-
      Comma-separated plugins to run, set by `ssebench run --plugin`; when it is
      set, it replaces the `enabled` field of `plugins.yaml`, and an empty value
      runs none. See [Plugins and hooks](/concepts/plugins-and-hooks).
  - name: SSE_DAEMON_SOCKET
    section: container
    used_by: [entrypoint, daemon, SDK]
    default: /tmp/sse.sock
    description: >-
      The daemon's agent-facing Unix socket, mode `0666`. The entrypoint sets it
      for every process it starts; in sidecar mode `ssebench run` sets it to
      `/run/ssebench/sse.sock`, on a root-owned volume the two containers share.
      Without it, the daemon serves HTTP only.
  - name: SSE_ADMIN_SOCKET
    section: container
    used_by: [entrypoint, daemon]
    default: /run/ssebench/admin.sock
    description: >-
      The daemon's privileged Unix socket, mode `0600`, root only: grading, the
      reference patch and phase changes. In sidecar mode it is on the volume the
      two containers share, and the task container's entrypoint sets it. The
      daemon binds it only when this is set; the entrypoint sets it, and points
      the evaluator's `SSE_DAEMON_SOCKET` at it. The SDK's
      `sse.reference.get_reference_patch` reads it to reach the admin socket.
  - name: SSE_AGENT_USER
    section: runtime
    used_by: [daemon]
    default: model
    description: >-
      The agent's user, whose processes the daemon kills when the agent phase
      ends.
  - name: SSE_RUNNER_USER
    section: runtime
    used_by: [daemon]
    default: sse-runner
    description: >-
      The unprivileged user the daemon runs the task's build, PoC and test
      scripts as, when it runs as root. A dedicated uid with no groups, neither
      the agent nor root; the tool layer creates it. The daemon refuses to start
      as root without it.
  - name: SSE_RUNNER_DIR
    section: runtime
    used_by: [daemon]
    default: /var/lib/ssebench-runner
    description: >-
      The root of the task runner's scratch copies, reachable only by the runner
      and root (`0710`). Each check runs in a private copy of the project here.

  # Runtime -------------------------------------------------------------------
  - name: SSE_DAEMON_TIMEOUT
    section: runtime
    used_by: [entrypoint]
    default: "300"
    description: Seconds to wait for the daemon's socket.
  - name: SSE_MCP_TIMEOUT
    section: runtime
    used_by: [entrypoint]
    default: "300"
    description: Seconds to wait for the MCP server.
  - name: SSE_DEBUG
    section: runtime
    used_by: [entrypoint]
    description: Any non-empty value turns on debug logs.
  - name: SSE_PLUGIN_NAME
    section: runtime
    used_by: [plugins]
    description: Set by the entrypoint for a plugin it runs; the plugin's name.
  - name: SSE_PLUGIN_HOOK
    section: runtime
    used_by: [plugins]
    description: >-
      Set by the entrypoint for a plugin it runs; the hook it runs at, such as
      `after-grading`.
  - name: SSE_ORACLE_FUZZ
    section: runtime
    used_by: [oracle plugin]
    description: >-
      `1` makes the oracle plugin fuzz the patched project after its review; it
      installs AFL++, so the run needs `--egress open`.
  - name: SSE_BENCH_PATH
    section: runtime
    used_by: [daemon]
    default: /ssebench
    description: Directory with the task's `config.yaml`, scripts and files.
  - name: SSE_HTTP_PORT
    section: runtime
    used_by: [daemon]
    default: "4263"
    description: The daemon's agent-facing HTTP port.
  - name: SSE_REPO_PATH
    section: runtime
    used_by: [daemon]
    default: /ssebench-repo
    description: >-
      Clean clone of the project that grading applies the agent's diff to and
      builds.
  - name: SSE_AGENT_DOCKER
    section: runtime
    used_by: [SDK]
    description: >-
      `host:port` of the daemon's HTTP listener, used when `SSE_DAEMON_SOCKET`
      is not set.
  - name: MCP_LOG_DIR
    section: runtime
    used_by: [MCP server]
    default: /tmp/mcp/logs
    description: >-
      Where the MCP server writes the full logs of long check results; see
      [Long logs](/reference/mcp-server#long-logs).
  - name: AGENT_DURATION
    section: runtime
    used_by: [evaluator]
    default: "0"
    description: The agent's run time in seconds; the entrypoint sets it for the evaluator.
  - name: SSE_METRIC_AGENT_TIMEOUT
    section: runtime
    used_by: [evaluator]
    description: >-
      Set to `true` by the entrypoint for the evaluator when the agent hit its
      time limit.
  - name: CLAUDE
    section: runtime
    used_by: [claude-code agent]
    description: >-
      Path of the Claude Code executable; the `claude-code` agent image sets it.
  - name: OPENCODE_CONFIG_CONTENT
    section: runtime
    used_by: [OpenCode]
    description: >-
      OpenCode's configuration as JSON; `sse.ai` and the `opencode` agent set it
      for the OpenCode server they start.

  # Web UI --------------------------------------------------------------------
  - name: SSEBENCH_WEBUI_HOST
    section: webui
    used_by: [web UI]
    default: 127.0.0.1
    description: Bind address of the API server and of the Vite dev and preview servers.
  - name: PORT
    section: webui
    used_by: [web UI]
    default: "3001"
    description: API server port; the Vite servers forward `/api` there.
  - name: SSEBENCH_WEBUI_TOKEN
    section: webui
    used_by: [web UI]
    description: >-
      Access token, at least 16 characters. Required when the bind address is
      not loopback.
  - name: SSEBENCH_WEBUI_CORS_ORIGINS
    section: webui
    used_by: [web UI]
    description: >-
      Comma-separated origins, besides the server's own, allowed to call the
      API, such as `https://bench.example.org`.
  - name: SSEBENCH_WEBUI_TERMINAL
    section: webui
    used_by: [web UI]
    default: "1"
    description: >-
      `0` turns off the container terminal. The demo's web UI has it off (`0`)
      unless you set this to `1`. Hosted mode (`SSEBENCH_WEBUI_HOSTED`) turns it
      off whatever this says.
  - name: SSEBENCH_WEBUI_HOSTED
    section: webui
    used_by: [web UI]
    default: "0"
    description: >-
      `1` runs the web UI as a read-only viewer, for a showcase or a shared
      server. It refuses to launch, stop or remove runs, opens no terminal, and
      lets the AI assistant run no commands in a container; runs and finished
      runs can still be read. See [Security model](/webui/security#hosted-mode).
  - name: SSEBENCH_CLI
    section: webui
    used_by: [web UI]
    default: uv run ssebench
    description: >-
      The command that runs the `ssebench` CLI, split on white space and started
      without a shell in `SSEBENCH_PATH`, such as `ssebench` or
      `uv run --project /opt/ssebench ssebench`. The web UI finds, stops, reaches
      and launches runs through it. The web UI image sets it to `ssebench`.
  - name: SSEBENCH_PATH
    section: webui
    used_by: [web UI]
    default: the repository root
    description: >-
      SSEBench checkout: the CLI runs there, so `results/` is read and written
      there, and `models/` and `agents/` are read from there.
  - name: SSEBENCH_LOCAL_TASKS
    section: webui
    used_by: [web UI]
    default: "`$SSEBENCH_PATH/datasets/pilot`"
    description: Local dataset offered in the launcher.
  - name: SSEBENCH_CATALOG_URL
    section: webui
    used_by: [web UI]
    description: Former name of `SSEBENCH_CATALOG`; deprecated, and read only when that is unset.
  - name: PTY_ENABLE_CLEANUP
    section: webui
    used_by: [web UI]
    default: "true"
    description: "`false` turns off the cleanup of terminal processes whose browser went away."
  - name: PTY_CLEANUP_INTERVAL
    section: webui
    used_by: [web UI]
    default: "30000"
    description: Milliseconds between two cleanups of terminal processes.
  - name: PTY_ORPHAN_THRESHOLD
    section: webui
    used_by: [web UI]
    default: "300000"
    description: Milliseconds without activity after which a terminal process is cleaned up.

  # Catalog service -----------------------------------------------------------
  - name: SSEBENCH_MANIFEST
    section: catalog
    used_by: [catalog service]
    default: datasets/pilot/manifest.json
    description: >-
      The `manifest.json` to serve (`--manifest`); `/srv/manifest.json` in the
      catalog image.
  - name: SSEBENCH_CATALOG_PORT
    section: catalog
    used_by: [catalog service]
    default: "8080"
    description: TCP port to listen on (`--port`).

  # Development ---------------------------------------------------------------
  - name: SSEBENCH_INTEGRITY_IMAGE
    section: development
    used_by: [integrity tests]
    default: the tool image that `ssebench run` builds for `gjson-196-bf4efcb`
    description: Sandbox tool image that `tests/integrity` attacks.
  - name: SSEBENCH_INTEGRITY_SIDECAR_ENV_IMAGE
    section: development
    used_by: [integrity tests]
    default: the task image that `ssebench run --mode sidecar` builds for `gjson-196-bf4efcb`
    description: Sidecar task image, with the daemon, that `tests/integrity` attacks.
  - name: SSEBENCH_INTEGRITY_SIDECAR_AGENT_IMAGE
    section: development
    used_by: [integrity tests]
    default: the sidecar runtime image of this version
    description: Sidecar agent runtime image that `tests/integrity` runs the fake agent in.
  - name: SSEBENCH_INTEGRITY_PLUGINS
    section: development
    used_by: [integrity tests]
    description: >-
      Plugins the sandbox container of the integrity tests enables, passed as
      `SSE_PLUGINS`; the image must have them installed.
  - name: SSEBENCH_INTEGRITY_SOURCE
    section: development
    used_by: [integrity tests]
    default: /src/gjson
    description: Source directory inside those images.
  - name: SSE_DAEMON_HTTP
    section: development
    used_by: [integrity tests]
    default: http://localhost:4263
    description: >-
      The daemon's HTTP listener that `tests/integrity/fake_agent.sh` probes; in
      sidecar mode, the task container's.
  - name: SSEBENCH_SMOKE_TASK
    section: development
    used_by: [tests/e2e/smoke.sh]
    default: gjson-196-bf4efcb
    description: Task of the end-to-end smoke run.
  - name: SSEBENCH_SMOKE_MODEL
    section: development
    used_by: [tests/e2e/smoke.sh]
    default: claude-sonnet-4-6
    description: Model the smoke run names; the `dummy` agent never calls it.
  - name: SSEBENCH_UPDATE_SNAPSHOTS
    section: development
    used_by: [SDK tests]
    description: >-
      `1` rewrites the snapshot of the task prompt in
      `sdk/python/tests/snapshots/` instead of comparing with it; see
      [Task prompt](/concepts/prompt#example).

# Names the scan finds that are not variables to document.
ignore:
  HOME: the user's home directory
  PATH: the executable search path
  FAKE_RUNNER_DIR: where the web UI tests' stand-in for the ssebench CLI keeps its state
