[package]
name = "ssebench"
description = "SSEBench SDK - Core library and daemon for code analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ssebench"
path = "src/lib.rs"

[[bin]]
name = "ssebench-daemon"
path = "src/main.rs"

[dependencies]
actix-web = "4"
anyhow = "1"
is_executable = "1.0"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["io-util", "process", "rt", "sync"] }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
log = "0.4"
env_logger = "0.11"
