[project]
name = "ssebench-sdk"
version = "1.0.0rc1"
description = "Python SDK of SSEBench, a benchmark for AI coding agents on real security vulnerabilities"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "SSEBench Team" }]
keywords = ["benchmark", "security", "vulnerability", "agents", "llm", "patch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "dacite>=1.8.0",
  "pytest>=8.3.5",
  "requests-unixsocket>=0.3.0",
  "typing_extensions>=4.0.0",
  "httpx>=0.27.0",
  "httpx-sse>=0.4",
  "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/42-b3yond-6ug/ssebench"
Documentation = "https://github.com/42-b3yond-6ug/ssebench/blob/main/docs/reference/python-sdk.md"
Repository = "https://github.com/42-b3yond-6ug/ssebench"
Issues = "https://github.com/42-b3yond-6ug/ssebench/issues"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sse", "sse.*"]

[tool.setuptools.package-data]
sse = ["py.typed"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "SIM",    # flake8-simplify
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["sse"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
