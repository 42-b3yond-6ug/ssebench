[project]
name = "ssebench.sdk"
version = "0.1.0"
description = "Python SDK for the SSEBench framework"
requires-python = ">=3.8"
authors = [{ name = "SSEBench Team" }]
license = "Apache-2.0"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
]
# dynamic = ["version"]
dependencies = [
  "dacite>=1.8.0",
  "pytest>=8.3.5",
  "requests-unixsocket>=0.3.0",
  "typing_extensions>=4.0.0",
  "httpx>=0.27.0",
  "httpx-sse>=0.4",
]

[project.urls]
Homepage = "https://github.com/42-b3yond-6ug/ssebench"
Issues = "https://github.com/42-b3yond-6ug/ssebench/issues"
Repository = "https://github.com/42-b3yond-6ug/ssebench"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sse", "sse.*"]

[dependency-groups]
dev = [
  "basedpyright>=1.29.0",
  "ruff>=0.8.0",
]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.8"
include = ["sse"]

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "SIM",    # flake8-simplify
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["sse"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["integration"]
