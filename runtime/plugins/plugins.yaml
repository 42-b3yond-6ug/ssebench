# yaml-language-server: $schema=./schema.json
#
# The plugins the tool layer installs. Each entry names a folder next to this
# file that holds an executable `run.sh`; schema.json describes the fields.
#
#   name     the folder name
#   enabled  run the plugin in every run; `ssebench run --plugin NAME` enables
#            it for one run
#   hook     before-agent, on-agent, after-agent, before-grading, on-grading or
#            after-grading. "before" and "after" plugins block the run until
#            they finish; "on" plugins start with the phase and run next to it.
#   llm      pass the run's LiteLLM endpoint, key and model to the plugin
#   timeout  minutes the plugin may run before it is stopped
#
# docs/concepts/plugins-and-hooks.md describes the contract.

# Writes a manifest of the run's results directory: every file, its size, its
# SHA-256 and the component that wrote it.
- name: artifact
  enabled: false
  hook: after-grading
  llm: false
  timeout: 5

# Reviews the agent's patch against the reference patch with an LLM, then tries
# to fuzz the patched project. Experimental; its output is for human review and
# never feeds into the grade.
- name: oracle
  enabled: false
  hook: after-grading
  llm: true
  timeout: 60
