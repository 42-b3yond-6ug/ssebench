target-version = "py310"
line-length = 120

[lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "B",  # flake8-bugbear
  "I",  # isort
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
